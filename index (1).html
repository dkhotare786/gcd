<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>गाव क्रिकेट LIVE</title>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3ee;--c:#fff;--ink:#14241b;--mut:#5d6f64;--g:#0f4d33;--r:#b3261e;--y:#f2a900;--ln:#d3dfd5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1a13;--c:#16261d;--ink:#e8f1ea;--mut:#9bb0a2;--g:#3fbf86;--ln:#274234}}
*{box-sizing:border-box}html,body{height:auto}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Mukta,system-ui,sans-serif;padding-bottom:78px}
header{background:var(--g);color:#fff;padding:12px 14px}header h1{margin:0;font-size:22px;font-weight:800}header p{margin:0;font-size:13px;opacity:.85}
main{max-width:720px;margin:auto;padding:10px}
.card{background:var(--c);border:1px solid var(--ln);border-radius:10px;padding:12px;margin:10px 0}
h2{font-size:18px;margin:14px 0 4px}h3{font-size:16px;margin:0}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--ln);border-radius:8px;font:inherit;background:var(--c);color:var(--ink)}
button{font:inherit;border:0;border-radius:8px;padding:8px 12px;background:var(--g);color:#fff;margin:3px 3px 3px 0}button.s{background:transparent;color:var(--g);border:1px solid var(--g)}button.d{background:var(--r)}
.m{color:var(--mut);font-size:13px}.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:12px;background:var(--ln);margin-right:4px}.live{background:var(--r);color:#fff}.ok{background:var(--g);color:#fff}
.sc{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;font-size:20px}.sc small{display:block;font-weight:400;font-size:12px;color:var(--mut)}
.pin{position:sticky;top:0;z-index:5;background:var(--r);color:#fff;padding:6px 12px;font-weight:600;font-size:14px;display:flex;justify-content:space-between}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--c);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;margin:0;padding:10px 2px;font-size:13px}nav button.on{color:var(--g);font-weight:800;border-top:3px solid var(--y)}
.sl{display:flex;gap:8px;overflow-x:auto}.sl .card{min-width:80%;margin:4px 0}.ph{width:46px;height:46px;border-radius:50%;object-fit:cover;background:var(--ln);flex:none}
.pl{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--ln)}img.b{width:100%;max-height:150px;object-fit:contain}
.sg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.sg button{margin:0;padding:12px 0}
.ph.big{width:100%;height:auto;border-radius:8px}table{width:100%;border-collapse:collapse}td,th{padding:6px 4px;text-align:center;border-bottom:1px solid var(--ln)}td:first-child,th:first-child{text-align:left}
</style></head><body>
<header><h1>🏏 गाव क्रिकेट LIVE</h1><p>आपल्या भागातील सामने, स्कोअर आणि निकाल</p></header>
<div id="pin"></div><main id="v"></main>
<nav id="nv"></nav>
<script>
const T=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10),T1=new Date(Date.now()+864e5-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const R=["विकेटकीपर","फलंदाज","गोलंदाज","अष्टपैलू"];
function seed(){const p=(n,r)=>({n,r,ph:""});const pl=a=>a.map((n,i)=>p(n,R[i%4]));
return{rate:50,aupi:"admin@upi",pin:null,sel:1,
teams:[{id:1,name:"जय भवानी XI",v:"शिरूर",cap:"",pl:pl(["राहुल","अमित","सचिन","विजय"])},{id:2,name:"शिवनेरी स्पोर्ट्स",v:"जुन्नर",cap:"",pl:pl(["प्रवीण","गणेश","निलेश","रोहन"])},{id:3,name:"वाघजाई CC",v:"मंचर",cap:"",pl:[]},{id:4,name:"भैरवनाथ संघ",v:"नारायणगाव",cap:"",pl:[]}],
tours:[{id:1,name:"शिरूर गाव चषक",v:"शिरूर",fee:1000,upi:"organizer@upi",rules:"१) ८ षटके  २) वेळेवर हजर  ३) पंचांचा निर्णय अंतिम",prizes:[{p:"१ ला",t:"₹21,000 + ट्रॉफी",w:null,ph:""},{p:"२ रा",t:"₹11,000",w:null,ph:""}],reg:[{tid:1,shot:"",ok:true},{tid:2,shot:"",ok:true}],pr:[]}],
matches:[{id:1,tour:1,a:1,b:2,d:T,t:"16:00",v:"शिरूर",ra:42,wa:2,ba:30,rb:0,wb:0,bb:0,inn:"a",st:"live",win:null,log:[]},{id:2,tour:1,a:3,b:4,d:T1,t:"10:00",v:"मंचर",ra:0,wa:0,ba:0,rb:0,wb:0,bb:0,inn:"a",st:"up",win:null,log:[]}],
ads:[],rem:[]}}
let S;try{S=JSON.parse(localStorage.getItem("gcd"))}catch(e){}S=S||seed();S.og=S.og||{fee:199,months:3,list:[]};S.sp=S.sp||[];S.aw=S.aw||"";let cog=null,cs=null;try{const me=JSON.parse(localStorage.getItem("gcd_me")||"null");if(me){if(me.r=="org")cog=me.id;if(me.r=="spn")cs=me.id}}catch(e){}
let tab="home",role="pub",sub="",tour=1,cteam=1;
const save=()=>{try{localStorage.setItem("gcd",JSON.stringify(S))}catch(e){}window.cloudSave&&cloudSave()},esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),tn=i=>(S.teams.find(t=>t.id==i)||{name:"?"}).name,tm=i=>S.teams.find(t=>t.id==i),mt=i=>S.matches.find(m=>m.id==i),tr=i=>S.tours.find(t=>t.id==i);
const ov=b=>Math.floor(b/6)+"."+b%6,dl=d=>d==T?"आज":d==T1?"उद्या":d;
function pick(cb){const i=document.createElement("input");i.type="file";i.accept="image/*";i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),k=Math.min(1,320/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.7))};im.src=r.result};r.readAsDataURL(f)};i.click()}
const go=(t,s)=>{tab=t;if(s!==undefined)sub=s;draw()},up=()=>{save();draw()},val=id=>document.getElementById(id).value;
function mc(m,o){const l=m.st=="live";return`<div class="card"><div class="m">${esc(tr(m.tour)?.name)} • ${esc(m.v)} • ${dl(m.d)} ${m.t} ${l?'<span class="pill live">LIVE</span>':m.st=="done"?'<span class="pill ok">निकाल</span>':""}</div>
<div class="sc"><div>${esc(tn(m.a))}<small>${m.st=="up"?"":m.ra+"/"+m.wa+" ("+ov(m.ba)+")"}</small></div><span class="m">vs</span><div style="text-align:right">${esc(tn(m.b))}<small>${m.st=="up"?"":m.rb+"/"+m.wb+" ("+ov(m.bb)+")"}</small></div></div>
${m.st=="done"?`<p><b>${m.win=="tie"?"सामना बरोबरीत":"विजेता: "+esc(tn(m.win))}</b></p>`:""}
${o||""}<button class="s" onclick="share(${m.id})">WhatsApp</button><button class="s" onclick="remind(${m.id})">${S.rem.includes(m.id)?"🔔 आठवण चालू":"🔔 आठवण"}</button>${l?`<button class="s" onclick="S.pin=${S.pin==m.id?null:m.id};up()">${S.pin==m.id?"📌 काढा":"📌 पिन"}</button>`:""}</div>`}
function share(i){const m=mt(i);open("https://wa.me/?text="+encodeURIComponent(`🏏 ${tn(m.a)} vs ${tn(m.b)}\n${m.v} • ${dl(m.d)} ${m.t}\n${m.st!="up"?m.ra+"/"+m.wa+" - "+m.rb+"/"+m.wb:""}`))}
function remind(i){const m=mt(i),k=S.rem.indexOf(i);if(k>=0)S.rem.splice(k,1);else{S.rem.push(i);try{Notification.requestPermission().then(p=>{const ms=new Date(m.d+"T"+m.t)-Date.now()-6e5;if(p=="granted"&&ms>0)setTimeout(()=>new Notification("सामना सुरू होणार",{body:tn(m.a)+" vs "+tn(m.b)}),ms)})}catch(e){}}up()}
function adsLive(){return S.ads.filter(a=>a.st=="paid"&&a.from<=T&&a.to>=T)}
function purge(){const L=Date.now()-72*36e5;let c=0;const z=o=>{if(o.shot&&o.at&&o.at<L){o.shot="";o.gone=true;c++}};S.tours.forEach(t=>t.reg.forEach(z));S.og.list.forEach(z);S.ads.forEach(z);if(c)save()}
function draw(){purge();const p=mt(S.pin);document.getElementById("pin").innerHTML=p&&p.st=="live"?`<div class="pin"><span>📌 ${esc(tn(p.a))} ${p.ra}/${p.wa} • ${esc(tn(p.b))} ${p.rb}/${p.wb}</span><span onclick="S.pin=null;up()">✕</span></div>`:"";
document.getElementById("nv").innerHTML=[["home","🏠","होम"],["m","🏏","सामने"],["tb","📊","गुणतालिका"],["tm","👥","संघ"],["pn","⚙️","पॅनल"]].map(x=>`<button class="${tab==x[0]?"on":""}" onclick="go('${x[0]}','')">${x[1]}<br>${x[2]}</button>`).join("");
document.getElementById("v").innerHTML=({home,m:matches,tb:table,tm:teams,pn:panel})[tab]();window.scrollTo(0,0)}
function home(){const a=adsLive(),l=S.matches.filter(m=>m.st=="live"&&pm(m)),u=S.matches.filter(m=>m.st=="up"&&pm(m));
return`${a.length?`<div class="sl">${a.map(adc).join("")}</div>`:""}<h2>🔴 आता LIVE</h2>${l.map(m=>mc(m)).join("")||'<p class="m">सध्या लाईव्ह सामना नाही.</p>'}
<h2>आज आणि उद्या कोणत्या गावात?</h2>${S.matches.filter(m=>(m.d==T||m.d==T1)&&pm(m)).map(m=>`<div class="card"><b>${dl(m.d)} — ${esc(m.v)}</b><br>${esc(tn(m.a))} vs ${esc(tn(m.b))} • ${m.t}</div>`).join("")||'<p class="m">आज-उद्या सामने नाहीत.</p>'}
<h2>बक्षिसे</h2>${S.tours.filter(pt).map(t=>`<div class="card"><h3>${esc(t.name)} (${esc(t.v)})</h3>${t.prizes.map(p=>`<div>${esc(p.p)} — ${esc(p.t)}</div>`).join("")}<p class="m">प्रवेश फी ₹${t.fee}</p></div>`).join("")}`}
const adc=a=>`<div class="card">${a.img?`<img class="b" src="${a.img}">`:""}<h3>${esc(a.title)}</h3><p>${esc(a.text)}</p>${a.wa?`<a href="https://wa.me/91${esc(a.wa)}">WhatsApp</a> `:""}${a.web?`<a href="${esc(a.web)}" rel="noopener">वेबसाइट</a>`:""}<div class="m">जाहिरात</div></div>`;
function matches(){return[...S.matches].filter(pm).sort((a,b)=>a.d.localeCompare(b.d)).map(m=>mc(m)).join("")||'<p class="m">सामने नाहीत.</p>'}
function table(){return S.tours.filter(pt).map(t=>{const r={};t.reg.filter(x=>x.ok).forEach(x=>r[x.tid]={p:0,w:0,l:0,pt:0});S.matches.filter(m=>m.tour==t.id&&m.st=="done").forEach(m=>{[m.a,m.b].forEach(i=>{if(!r[i])r[i]={p:0,w:0,l:0,pt:0};r[i].p++;if(m.win=="tie")r[i].pt++;else if(m.win==i){r[i].w++;r[i].pt+=2}else r[i].l++})});
const rows=Object.entries(r).sort((a,b)=>b[1].pt-a[1].pt);return`<div class="card"><h3>${esc(t.name)}</h3><table><tr><th>संघ</th><th>खे</th><th>वि</th><th>प</th><th>गुण</th></tr>${rows.map(([i,x])=>`<tr><td>${esc(tn(i))}</td><td>${x.p}</td><td>${x.w}</td><td>${x.l}</td><td><b>${x.pt}</b></td></tr>`).join("")}</table></div>
<h3>जुने निकाल</h3>${S.matches.filter(m=>m.tour==t.id&&m.st=="done").map(m=>mc(m)).join("")||'<p class="m">निकाल नाहीत.</p>'}${t.prizes.some(p=>p.w)?`<h3>बक्षीस वितरण</h3>${t.prizes.filter(p=>p.w).map(p=>`<div class="card">${p.ph?`<img class="b" src="${p.ph}">`:""}<b>${esc(p.p)}: ${esc(tn(p.w))}</b> — ${esc(p.t)}</div>`).join("")}`:""}`}).join("")}
function teams(){if(sub){const t=tm(sub);return`<button class="s" onclick="go('tm','')">← मागे</button><div class="card"><h3>${esc(t.name)}</h3><div class="m">${esc(t.v)}</div>${t.pl.map(p=>`<div class="pl"><img class="ph" src="${p.ph||"data:image/gif;base64,R0lGODlhAQABAAAAACw="}"><div><b>${esc(p.n)}</b><br><span class="pill">${esc(p.r)}</span></div></div>`).join("")||'<p class="m">खेळाडू नाहीत.</p>'}</div>`}
return`<h2>नोंदणीकृत संघ</h2>${S.teams.map(t=>`<div class="card" onclick="go('tm',${t.id})"><h3>${esc(t.name)}</h3><span class="m">${esc(t.v)} • ${t.pl.length}/15 खेळाडू</span></div>`).join("")}<h2>आगामी स्पर्धा</h2>${S.tours.filter(pt).map(t=>`<div class="card"><h3>${esc(t.name)}</h3><div class="m">${esc(t.v)}${t.venue?", "+esc(t.venue):""}${t.d1?" • "+dl(t.d1)+(t.d2&&t.d2!=t.d1?" → "+t.d2:""):""} • फी ₹${t.fee}</div><p>${esc(t.rules)}</p><button onclick="role='cap';go('pn','')">संघ म्हणून सहभाग घ्या</button></div>`).join("")}`}
function panel(){if(role=="pub")return`<h2>तुमची भूमिका निवडा</h2><p class="m">डेमो आहे: खरे लॉगिन (OTP) सर्व्हर जोडल्यावर येईल.</p>${[["cap","संघ / कॅप्टन"],["org","आयोजक"],["spn","प्रायोजक"],["adm","Admin"]].map(x=>`<button onclick="role='${x[0]}';go('pn','')" style="display:block;width:100%;padding:14px">${x[1]} पॅनल</button>`).join("")}`;
return`<button class="s" onclick="role='pub';go('pn','')">← भूमिका बदला</button>`+({cap,org,spn,adm})[role]()}
function cap(){const t=tm(cteam)||S.teams[0];return`<h2>संघ पॅनल</h2><select onchange="cteam=+this.value;draw()">${S.teams.map(x=>`<option value="${x.id}" ${x.id==t.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select><button class="s" onclick="newTeam()">+ नवीन संघ</button>
<div class="card"><h3>${esc(t.name)} — ${t.pl.length}/15</h3>${t.pl.map((p,i)=>`<div class="pl"><img class="ph" src="${p.ph||"data:image/gif;base64,R0lGODlhAQABAAAAACw="}"><div style="flex:1"><b>${esc(p.n)}</b><br><span class="pill">${esc(p.r)}</span></div><button class="d" onclick="tm(${t.id}).pl.splice(${i},1);up()">✕</button></div>`).join("")}
${t.pl.length<15?`<label>नाव</label><input id="pn"><label>भूमिका</label><select id="pr">${R.map(r=>`<option>${r}</option>`).join("")}</select><button class="s" onclick="pick(d=>{window.pp=d;this.textContent='फोटो ✓'})">📷 फोटो (आवश्यक)</button><button onclick="addP(${t.id})">खेळाडू जोडा</button>`:'<p class="m">१५ खेळाडू पूर्ण.</p>'}</div>
<h2>स्पर्धेत सहभाग</h2>${S.tours.filter(pt).map(x=>{const r=x.reg.find(q=>q.tid==t.id);return`<div class="card"><h3>${esc(x.name)}</h3><div class="m">फी ₹${x.fee} • UPI: ${esc(x.upi)}</div>${r?`<span class="pill ${r.ok?"ok":""}">${r.ok?"मंजूर":"मंजुरीसाठी प्रलंबित"}</span>`:`<a href="upi://pay?pa=${esc(x.upi)}&am=${x.fee}&tn=${encodeURIComponent(x.name)}">PhonePe / GPay ने भरा</a><br><button onclick="pick(d=>{tr(${x.id}).reg.push({tid:${t.id},shot:d,at:Date.now(),ok:false});up()})">पेमेंट स्क्रीनशॉट अपलोड करा</button>`}</div>`}).join("")}`}
function newTeam(){const n=prompt("संघाचे नाव"),v=n&&prompt("गाव");if(v){S.teams.push({id:Date.now(),name:n,v,pl:[]});cteam=S.teams.at(-1).id;up()}}
function addP(id){if(!val("pn")||!window.pp)return alert("नाव आणि फोटो आवश्यक");tm(id).pl.push({n:val("pn"),r:val("pr"),ph:window.pp});window.pp=null;up()}
function org(){const t=tr(tour);return`<h2>आयोजक पॅनल</h2>${t.st=="pending"?'<div class="card"><span class="pill">Admin मंजुरी प्रलंबित</span><p class="m">ही स्पर्धा Admin ला पाठवली आहे. मंजुरीपर्यंत ती सार्वजनिक दिसणार नाही आणि संघ नोंदणी करू शकणार नाहीत. नियम, फी, UPI आणि बक्षिसे भरा.</p></div>':t.st=="rejected"?'<div class="card"><span class="pill">Admin ने नाकारली</span></div>':""}<select onchange="tour=+this.value;draw()">${S.tours.map(x=>`<option value="${x.id}" ${x.id==tour?"selected":""}>${esc(x.name)}</option>`).join("")}</select><button class="s" onclick="newTour()">+ नवीन स्पर्धा</button>
<div class="card"><h3>स्पर्धेची माहिती (Admin खात्री करेल)</h3><label>गाव</label><input id="tv" value="${esc(t.v)}"><label>ठिकाण / मैदान</label><input id="tpl" value="${esc(t.venue||"")}"><div style="display:flex;gap:6px"><div><label>सुरू तारीख</label><input id="td1" type="date" value="${t.d1||""}"></div><div><label>शेवट तारीख</label><input id="td2" type="date" value="${t.d2||""}"></div></div><p class="m">मंजुरीनंतर यात बदल केला तर Admin ला पुन्हा खात्री करावी लागेल.</p><button onclick="const t=tr(${t.id}),ch=t.v!=val('tv')||(t.venue||'')!=val('tpl')||(t.d1||'')!=val('td1')||(t.d2||'')!=val('td2');t.v=val('tv');t.venue=val('tpl');t.d1=val('td1');t.d2=val('td2');if(ch)t.st='pending';up()">सेव्ह</button></div>
<div class="card"><h3>नियम, फी, UPI</h3><label>नियम (संघांना दिसतील)</label><textarea id="ru">${esc(t.rules)}</textarea><div style="display:flex;gap:6px"><div><label>फी ₹</label><input id="fe" type="number" value="${t.fee}"></div><div><label>PhonePe/GPay/UPI</label><input id="up" value="${esc(t.upi)}"></div></div><button onclick="const t=tr(${t.id});t.rules=val('ru');t.fee=+val('fe');t.upi=val('up');up()">सेव्ह</button></div>
<div class="card"><h3>बक्षिसे</h3>${t.prizes.map((p,i)=>`<div class="pl"><span style="flex:1">${esc(p.p)} — ${esc(p.t)}${p.w?" → <b>"+esc(tn(p.w))+"</b>":""}</span><button class="s" onclick="prize(${t.id},${i})">विजेता+फोटो</button></div>`).join("")}<input id="pp1" placeholder="उदा. ३ रा"><input id="pp2" placeholder="₹5,000 + ट्रॉफी" style="margin-top:4px"><button onclick="tr(${t.id}).prizes.push({p:val('pp1'),t:val('pp2'),w:null,ph:''});up()">बक्षीस जोडा</button></div>

function ogAdm(){return`<div class="card"><label>Admin WhatsApp (PIN रीसेटसाठी, १० अंक)</label><input id="awn" value="${esc(S.aw)}"><button onclick="S.aw=val('awn');up()">सेव्ह</button></div>${S.sp.map(s=>`<div class="card">प्रायोजक: <b>${esc(s.name)}</b> ${esc(s.m)} <button class="s" onclick="rp('sp',${s.id})">PIN रीसेट</button></div>`).join("")}<div class="card"><h3>आयोजक नोंदणी</h3><div style="display:flex;gap:6px"><div><label>फी ₹</label><input id="gf" type="number" value="${S.og.fee}"></div><div><label>वैधता (महिने)</label><input id="gm" type="number" value="${S.og.months}"></div></div><button onclick="S.og.fee=+val('gf');S.og.months=+val('gm');up()">सेव्ह</button></div>${S.og.list.map(o=>{const s=ost(o);return`<div class="card"><b>${esc(o.name)}</b> • ${esc(o.v)} • ${esc(o.m)}<br><span class="pill ${s=="active"?"ok":""}">${OL[s]}</span>${o.exp?`<span class="m">वैधता ${o.exp}</span>`:""}${o.shot?` <img class="ph" src="${o.shot}" onclick="this.classList.toggle('big')">`:""}<br>${o.req?`<button onclick="const o=og(${o.id});o.exp=addMo(o.exp&&o.exp>T?o.exp:T,S.og.months);o.req=false;o.off=false;up()">पेमेंट मंजूर (+${S.og.months} महिने)</button>`:""}<button class="s" onclick="rp('org',${o.id})">PIN रीसेट</button><button class="${o.off?"":"d"}" onclick="og(${o.id}).off=${!o.off};up()">${o.off?"चालू करा":"बंद करा"}</button></div>`}).join("")||'<p class="m">आयोजक नाहीत.</p>'}`}
const sp=i=>S.sp.find(x=>x.id==i),BK=`<button class="s" onclick="role='pub';go('pn','')">← भूमिका बदला</button>`,LO=r=>`<button class="s" onclick="logout('${r}')">लॉगआउट</button>`,lg=(r,id)=>{try{localStorage.setItem("gcd_me",JSON.stringify({r,id}))}catch(e){}};

</script><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
